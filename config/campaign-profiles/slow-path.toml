[metadata]
name = "slow-path"
description = "Firmware profile for slower SBI paths and longer replay validation."

[firmware]
duration_secs = 300
timeout_ms = 750
smp = 2
cores = "1"
replay_timeout_secs = 30
replay_max_buckets = 64
hang_stability_attempts = 3
skip_halt = true
helper_bin = "target/release/helper"
fuzzer_bin = "cargo"
