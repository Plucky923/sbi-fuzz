[metadata]
extension = "rfence"
note = "Remote fence calls mix hart-mask pointers with address and span arguments."

# sbi_remote_fence_i: Instruction fence on remote harts
[[calls]]
eid = 0x52464E43
fid = 0x0
arg0 = "hart_mask_address"  # pointer to hart mask
arg1 = "value"              # hart_mask_base
arg2 = "value"
arg3 = "value"
arg4 = "value"
arg5 = "value"

# sbi_remote_sfence_vma: SFENCE.VMA on remote harts
[[calls]]
eid = 0x52464E43
fid = 0x1
arg0 = "hart_mask_address"  # pointer to hart mask
arg1 = "value"              # hart_mask_base
arg2 = "address"            # start_addr
arg3 = "size"               # size
arg4 = "value"
arg5 = "value"

